
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Positioning Task</title>

    <style>
        body {
            padding-bottom: 250px;
            font-family: "Times New Roman";
            font-size: 12px;
        }

        .page {
            position: relative;
            width: 250px;
            margin: 70px auto 20px;
        }

        .box-static {
            position: static;
            width: 67px;
            height: 67px;
            margin-bottom: 4px;
            background-color: lightblue;
        }

        .box-relative-1 {
            position: relative;
            top: 13px;
            left: 12px;
            width: 83px;
            height: 83px;
            background-color: lightgreen;
        }

        .box-relative-2 {
            position: relative;
            top: -12px;
            left: 17px;
            width: 100px;
            height: 100px;
            background-color: pink;
        }

        .container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-top: 8px;
            background-color: lightgray;
        }

        .box-absolute-1 {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 83px;
            height: 83px;
            background-color: coral;
            z-index: 3;
        }

        .box-absolute-2 {
            position: absolute;
            top: 58px;
            left: 42px;
            width: 100px;
            height: 100px;
            background-color: skyblue;
            z-index: 2;
        }

        .box-absolute-3 {
            position: absolute;
            top: 100px;
            left: 67px;
            width: 117px;
            height: 117px;
            background-color: purple;
            z-index: 1;
        }

        .box-zindex-1 {
            position: absolute;
            top: 25px;
            left: 112px;
            width: 125px;
            height: 125px;
            background-color: lightcoral;
            z-index: 5;
        }

        .box-zindex-2 {
            position: absolute;
            top: 67px;
            left: 137px;
            width: 125px;
            height: 125px;
            background-color: lightseagreen;
            z-index: 4;
        }

        .box-fixed-1 {
            position: fixed;
            top: 62px;
            left: 50%;
            margin-left: 95px;
            width: 67px;
            height: 67px;
            background-color: yellow;
            z-index: 1;
        }

        .box-fixed-2 {
            position: fixed;
            bottom: 17px;
            left: 50%;
            margin-left: -128px;
            width: 83px;
            height: 83px;
            background-color: orange;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Статические блоки -->
        <div class="box-static">Static</div>
        <div class="box-static">Static</div>

        <!-- Относительные блоки -->
        <div class="box-relative-1">Relative 1</div>
        <div class="box-relative-2">Relative 2</div>

        <!-- Контейнер с абсолютными блоками -->
        <div class="container">
            <div class="box-absolute-1">Absolute 1</div>
            <div class="box-absolute-2">Absolute 2</div>
            <div class="box-absolute-3">Absolute 3</div>
        </div>

        <!-- Перекрывающиеся блоки -->
        <div class="box-zindex-1">Z-Index 5</div>
        <div class="box-zindex-2">Z-Index 4</div>

        <!-- Фиксированные блоки -->
        <div class="box-fixed-1">Fixed Top-Right</div>
        <div class="box-fixed-2">Fixed Bottom-Left</div>

    </div>

</body>
</html>
